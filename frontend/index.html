<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>VeriFlow | Automated Background Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="stylesheet" href="/src/index.css" />
</head>
<body class="antialiased" style="font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;">
    <div class="min-h-screen flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-2xl shadow-2xl p-8">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-gradient-to-r from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                        <i class="fas fa-shield-alt text-white text-3xl"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800">VeriFlow</h2>
                    <p class="text-gray-500 mt-2">Automated Background Verification System</p>
                </div>
                
                <form id="loginForm" class="space-y-5">
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-envelope mr-2 text-gray-400"></i>Email Address
                        </label>
                        <input type="email" id="username" name="username" required 
                            class="w-full px-4 py-3 text-gray-800 border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                            placeholder="Enter your email" autocomplete="username" />
                    </div>
                    
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-lock mr-2 text-gray-400"></i>Password
                        </label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required 
                                class="w-full px-4 py-3 text-gray-800 border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                                placeholder="Enter your password" autocomplete="current-password" />
                            <button type="button" id="togglePassword" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex items-center justify-between">
                        <label class="flex items-center cursor-pointer">
                            <input type="checkbox" id="rememberMe" class="w-4 h-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
                            <span class="ml-2 text-sm text-gray-600">Remember me</span>
                        </label>
                        <button type="button" id="forgotPasswordBtn" class="text-sm text-blue-600 hover:text-blue-700 hover:underline">
                            Forgot password?
                        </button>
                    </div>
                    
                    <div id="loginMessage" class="text-sm rounded-lg p-3 hidden"></div>
                    
                    <button type="submit" id="loginBtn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-semibold rounded-xl transition-all transform hover:scale-105 shadow-lg">
                        <span id="loginText">Sign In</span>
                        <span id="loginLoader" class="hidden"><i class="fas fa-spinner fa-spin"></i> Signing in...</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="fixed inset-0 bg-black bg-opacity-50 z-50 hidden items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-md w-full p-8 shadow-2xl transform transition-all">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-2xl font-bold text-gray-800">Reset Password</h3>
                <button id="closeModal" class="text-gray-400 hover:text-gray-600 text-2xl">&times;</button>
            </div>
            <p class="text-gray-600 mb-6">Enter your email address and we'll send you a link to reset your password.</p>
            <form id="forgotForm">
                <input type="email" id="resetEmail" required 
                    class="w-full px-4 py-3 text-gray-800 border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all mb-4"
                    placeholder="Enter your email address" />
                <div id="resetMessage" class="text-sm rounded-lg p-3 hidden mb-4"></div>
                <button type="submit" id="sendResetBtn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-semibold rounded-xl transition-all">
                    Send Reset Link
                </button>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const rememberMeCheckbox = document.getElementById('rememberMe');
        const loginMessage = document.getElementById('loginMessage');
        const loginBtn = document.getElementById('loginBtn');
        const loginText = document.getElementById('loginText');
        const loginLoader = document.getElementById('loginLoader');
        const togglePassword = document.getElementById('togglePassword');
        const forgotBtn = document.getElementById('forgotPasswordBtn');
        const modal = document.getElementById('forgotModal');
        const closeModal = document.getElementById('closeModal');
        const forgotForm = document.getElementById('forgotForm');
        const resetEmail = document.getElementById('resetEmail');
        const resetMessage = document.getElementById('resetMessage');
        const sendResetBtn = document.getElementById('sendResetBtn');

        function showMessage(element, message, isError = true) {
            element.textContent = message;
            element.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'bg-red-50', 'text-red-700');
            if (isError) {
                element.classList.add('bg-red-50', 'text-red-700');
            } else {
                element.classList.add('bg-green-50', 'text-green-800');
            }
            setTimeout(() => element.classList.add('hidden'), 4000);
        }

        loadSavedCredentials();

        function loadSavedCredentials() {
            const savedEmail = localStorage.getItem('savedEmail');
            const savedPassword = localStorage.getItem('savedPassword');
            const remember = localStorage.getItem('remember');
            if (remember === 'true' && savedEmail) {
                usernameInput.value = savedEmail;
                if (savedPassword) passwordInput.value = savedPassword;
                rememberMeCheckbox.checked = true;
            }
        }

        function saveCredentials(email, password) {
            if (rememberMeCheckbox.checked) {
                localStorage.setItem('savedEmail', email);
                localStorage.setItem('savedPassword', password);
                localStorage.setItem('remember', 'true');
            } else {
                localStorage.removeItem('savedEmail');
                localStorage.removeItem('savedPassword');
                localStorage.setItem('remember', 'false');
            }
        }

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = usernameInput.value;
            const password = passwordInput.value;

            loginText.classList.add('hidden');
            loginLoader.classList.remove('hidden');
            loginBtn.disabled = true;

            setTimeout(() => {
                if (email === 'admin@veriflow.com' && password === 'admin123') {
                    saveCredentials(email, password);
                    showMessage(loginMessage, '✅ Admin login successful! Redirecting...', false);
                    setTimeout(() => alert('Welcome to Admin Dashboard'), 500);
                } 
                else if (email === 'candidate@veriflow.com' && password === 'cand123') {
                    saveCredentials(email, password);
                    showMessage(loginMessage, '✅ Candidate login successful! Redirecting...', false);
                    setTimeout(() => alert('Welcome to Candidate Dashboard'), 500);
                }
                else {
                    showMessage(loginMessage, '❌ Invalid credentials. Use admin@veriflow.com/admin123 or candidate@veriflow.com/cand123');
                }
                
                loginText.classList.remove('hidden');
                loginLoader.classList.add('hidden');
                loginBtn.disabled = false;
            }, 1000);
        });

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            togglePassword.querySelector('i').classList.toggle('fa-eye');
            togglePassword.querySelector('i').classList.toggle('fa-eye-slash');
        });

        forgotBtn.addEventListener('click', () => {
            modal.classList.remove('hidden');
            modal.classList.add('flex');
        });

        closeModal.addEventListener('click', () => {
            modal.classList.add('hidden');
            modal.classList.remove('flex');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.add('hidden');
                modal.classList.remove('flex');
            }
        });

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = resetEmail.value;
            
            sendResetBtn.disabled = true;
            sendResetBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
            
            setTimeout(() => {
                const resetToken = Math.random().toString(36).substring(2, 20);
                localStorage.setItem(`reset_${email}`, resetToken);
                
                console.log(`========================================`);
                console.log(`📧 Password Reset Email Sent to: ${email}`);
                console.log(`🔗 Reset Link: http://localhost:5173/reset-password.html?token=${resetToken}&email=${encodeURIComponent(email)}`);
                console.log(`========================================`);
                
                showMessage(resetMessage, `✅ Reset link sent to ${email}! Check console for demo link.`, false);
                
                setTimeout(() => {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                    resetEmail.value = '';
                    sendResetBtn.disabled = false;
                    sendResetBtn.innerHTML = 'Send Reset Link';
                }, 2000);
            }, 1000);
        });
    </script>
</body>
</html>
