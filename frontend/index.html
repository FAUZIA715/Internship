<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>VeriFlow | Automated Background Verification</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="antialiased" style="font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif; background: linear-gradient(135deg, #f6f9fc 0%, #eef2f7 100%); min-height: 100vh;">
    <div class="min-h-screen flex items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
        <div class="w-full max-w-md">
            <div class="flex justify-center mb-6">
                <div class="inline-flex items-center gap-2 bg-white/70 backdrop-blur-sm rounded-full px-4 py-1.5 shadow-sm border border-gray-200/60">
                    <span class="relative flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
                    </span>
                    <span class="text-xs font-semibold text-gray-700 tracking-wide">AUTOMATED VERIFICATION</span>
                </div>
            </div>
            <div style="background: rgba(255, 255, 255, 0.98); border-radius: 2rem; box-shadow: 0 25px 45px -12px rgba(0, 0, 0, 0.15), 0 1px 2px rgba(0, 0, 0, 0.02); border: 1px solid rgba(255, 255, 255, 0.5);" class="p-6 sm:p-8">
                <div class="flex justify-between items-center mb-5">
                    <div>
                        <h2 class="text-2xl font-bold text-gray-800">Welcome back</h2>
                        <p class="text-sm text-gray-500 mt-1">Sign in to your verification portal</p>
                    </div>
                    <div class="h-10 w-10 rounded-full bg-blue-50 flex items-center justify-center">
                        <i class="fas fa-fingerprint text-blue-600 text-xl"></i>
                    </div>
                </div>
                
                <form id="loginForm" class="space-y-5">
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                            <i class="fas fa-user text-gray-400 text-xs"></i>Username or Email
                        </label>
                        <div class="relative">
                            <input type="text" id="username" name="username" required 
                                class="w-full pl-10 pr-3 py-2.5 text-gray-800 placeholder:text-gray-400 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                                placeholder="john.doe@example.com / candidate01" autocomplete="username" />
                            <i class="fas fa-envelope absolute left-3 top-3.5 text-gray-400 text-sm"></i>
                        </div>
                    </div>
                    
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-gray-700 flex items-center gap-2">
                            <i class="fas fa-lock text-gray-400 text-xs"></i>Password
                        </label>
                        <div class="relative">
                            <input type="password" id="password" name="password" required 
                                class="w-full pl-10 pr-10 py-2.5 text-gray-800 border border-gray-200 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                                placeholder="••••••••" autocomplete="current-password" />
                            <i class="fas fa-key absolute left-3 top-3.5 text-gray-400 text-sm"></i>
                            <button type="button" id="togglePassword" class="absolute right-3 top-2.5 text-gray-400 hover:text-gray-600 transition">
                                <i class="fas fa-eye-slash text-sm"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="flex justify-end">
                        <button type="button" id="demoHintBtn" class="text-xs text-blue-500 hover:text-blue-700 flex items-center gap-1">
                            <i class="fas fa-info-circle"></i> Demo credentials?
                        </button>
                    </div>
                    
                    <div id="loginMessage" class="text-sm rounded-lg p-2 hidden"></div>
                    
                    <button type="submit" id="loginBtn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-blue-800 hover:from-blue-700 hover:to-blue-900 text-white font-semibold text-base rounded-xl flex items-center justify-center gap-2 transition-all cursor-pointer shadow-md hover:shadow-lg">
                        <i class="fas fa-arrow-right-to-bracket"></i> Sign In
                        <span id="loaderIcon" class="hidden ml-2"><i class="fas fa-spinner fa-spin"></i></span>
                    </button>
                </form>
            </div>
        </div>
    </div>
    
    <div id="toastMsg" class="fixed bottom-5 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-300 opacity-0 pointer-events-none"></div>
    
    <script>
        const loginForm = document.getElementById('loginForm');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const loginMessageDiv = document.getElementById('loginMessage');
        const loginBtn = document.getElementById('loginBtn');
        const loaderIcon = document.getElementById('loaderIcon');
        const toggleBtn = document.getElementById('togglePassword');
        const demoHintBtn = document.getElementById('demoHintBtn');

        function showMessage(message, isError = true) {
            loginMessageDiv.innerText = message;
            loginMessageDiv.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'bg-red-50', 'text-red-700', 'bg-blue-50', 'text-blue-700');
            if (isError) {
                loginMessageDiv.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
            } else {
                loginMessageDiv.classList.add('bg-green-50', 'text-green-800', 'border', 'border-green-200');
            }
            loginMessageDiv.classList.remove('hidden');
            setTimeout(() => {
                if (loginMessageDiv && !loginMessageDiv.classList.contains('hidden')) {
                    loginMessageDiv.classList.add('hidden');
                }
            }, 3800);
        }

        function showToast(message, type = 'info') {
            const toast = document.getElementById('toastMsg');
            if (!toast) return;
            const bgColor = type === 'error' ? 'bg-red-600' : (type === 'success' ? 'bg-emerald-600' : 'bg-gray-800');
            toast.innerHTML = `<div class="${bgColor} text-white px-5 py-2 rounded-full shadow-lg text-sm font-medium flex items-center gap-2"><i class="fas ${type === 'error' ? 'fa-exclamation-triangle' : 'fa-circle-check'}"></i>${message}</div>`;
            toast.classList.remove('opacity-0', 'translate-y-2');
            toast.classList.add('opacity-100', 'translate-y-0');
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                toast.classList.remove('opacity-100', 'translate-y-0');
            }, 3000);
        }

        function performAuthentication(username, password) {
            if (!username || username.trim() === "") {
                showMessage("Please enter username/email.", true);
                return false;
            }
            if (!password || password.trim() === "") {
                showMessage("Password cannot be empty.", true);
                return false;
            }

            let role = null;
            if ((username.toLowerCase() === 'admin@veriflow.com' || username.toLowerCase() === 'admin') && password === 'admin123') {
                role = 'admin';
            } 
            else if ((username.toLowerCase() === 'candidate@example.com' || username.toLowerCase() === 'candidate01' || username.toLowerCase() === 'candidate') && password === 'cand123') {
                role = 'candidate';
            }
            else if (username.toLowerCase() === 'user@demo.com' && password === 'demo123') {
                role = 'candidate';
            }
            else {
                showMessage("Invalid credentials. Use admin@veriflow.com/admin123 or candidate@example.com/cand123", true);
                return false;
            }

            if (role === 'admin') {
                showMessage("Admin authentication successful! Redirecting...", false);
                setTimeout(() => {
                    showToast("Welcome Admin!", "success");
                }, 800);
                return true;
            } else if (role === 'candidate') {
                showMessage(`Welcome ${username}! Redirecting...`, false);
                setTimeout(() => {
                    showToast("Welcome Candidate!", "success");
                }, 800);
                return true;
            }
            return false;
        }

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const username = usernameInput.value;
            const password = passwordInput.value;
            
            loginBtn.disabled = true;
            loaderIcon.classList.remove('hidden');
            const originalText = loginBtn.innerHTML;
            loginBtn.innerHTML = '<i class="fas fa-arrow-right-to-bracket"></i> Signing in...';
            
            setTimeout(() => {
                performAuthentication(username, password);
                loginBtn.disabled = false;
                loaderIcon.classList.add('hidden');
                loginBtn.innerHTML = originalText;
            }, 500);
        });

        toggleBtn.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            const icon = toggleBtn.querySelector('i');
            if (type === 'text') {
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            } else {
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            }
        });

        demoHintBtn.addEventListener('click', () => {
            showMessage("Demo: admin@veriflow.com/admin123 or candidate@example.com/cand123", false);
            showToast("Use demo credentials", "info");
        });

        const inputs = [usernameInput, passwordInput];
        inputs.forEach(inp => {
            inp.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    loginForm.dispatchEvent(new Event('submit'));
                }
            });
        });
    </script>
</body>
</html>
