<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VeriFlow | Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
</head>
<body class="antialiased" style="font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh;">
    <div class="min-h-screen flex items-center justify-center px-4">
        <div class="w-full max-w-md">
            <div class="bg-white rounded-2xl shadow-2xl p-8">
                <div class="text-center mb-8">
                    <div class="w-20 h-20 bg-gradient-to-r from-blue-500 to-purple-600 rounded-2xl flex items-center justify-center mx-auto mb-4 shadow-lg">
                        <i class="fas fa-lock text-white text-3xl"></i>
                    </div>
                    <h2 class="text-3xl font-bold text-gray-800">Create New Password</h2>
                    <p class="text-gray-500 mt-2">Please enter your new password below</p>
                </div>
                
                <form id="resetForm">
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-key mr-2 text-gray-400"></i>New Password
                        </label>
                        <div class="relative">
                            <input type="password" id="newPassword" required 
                                class="w-full px-4 py-3 text-gray-800 border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                                placeholder="Enter new password" />
                            <button type="button" id="toggleNew" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div class="mb-4">
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            <i class="fas fa-check-circle mr-2 text-gray-400"></i>Confirm Password
                        </label>
                        <div class="relative">
                            <input type="password" id="confirmPassword" required 
                                class="w-full px-4 py-3 text-gray-800 border border-gray-300 rounded-xl focus:border-blue-500 focus:ring-2 focus:ring-blue-200 outline-none transition-all"
                                placeholder="Confirm your password" />
                            <button type="button" id="toggleConfirm" class="absolute right-3 top-3 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye-slash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <div id="resetMessage" class="text-sm rounded-lg p-3 hidden mb-4"></div>
                    
                    <button type="submit" id="resetBtn" class="w-full py-3 bg-gradient-to-r from-blue-600 to-purple-600 hover:from-blue-700 hover:to-purple-700 text-white font-semibold rounded-xl transition-all transform hover:scale-105 shadow-lg">
                        Reset Password
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <a href="index.html" class="text-sm text-blue-600 hover:text-blue-700 hover:underline">
                        <i class="fas fa-arrow-left mr-1"></i> Back to Login
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const email = decodeURIComponent(urlParams.get('email') || '');
        
        const newPassword = document.getElementById('newPassword');
        const confirmPassword = document.getElementById('confirmPassword');
        const resetForm = document.getElementById('resetForm');
        const resetMessage = document.getElementById('resetMessage');
        const resetBtn = document.getElementById('resetBtn');

        if (!token || !email) {
            resetMessage.classList.remove('hidden');
            resetMessage.classList.add('bg-red-50', 'text-red-700');
            resetMessage.innerHTML = '<i class="fas fa-exclamation-triangle mr-2"></i>Invalid reset link. Please request a new one.';
            resetBtn.disabled = true;
        }

        function showMessage(message, isError = true) {
            resetMessage.textContent = message;
            resetMessage.classList.remove('hidden', 'bg-green-50', 'text-green-800', 'bg-red-50', 'text-red-700');
            if (isError) {
                resetMessage.classList.add('bg-red-50', 'text-red-700');
            } else {
                resetMessage.classList.add('bg-green-50', 'text-green-800');
            }
            setTimeout(() => resetMessage.classList.add('hidden'), 4000);
        }

        resetForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const pass = newPassword.value;
            const confirm = confirmPassword.value;
            
            if (pass.length < 6) {
                showMessage('Password must be at least 6 characters long');
                return;
            }
            
            if (pass !== confirm) {
                showMessage('Passwords do not match');
                return;
            }
            
            const savedToken = localStorage.getItem(`reset_${email}`);
            
            if (savedToken === token) {
                localStorage.setItem(`password_${email}`, pass);
                localStorage.removeItem(`reset_${email}`);
                showMessage('✅ Password reset successful! Redirecting to login...', false);
                setTimeout(() => {
                    window.location.href = 'index.html';
                }, 2000);
            } else {
                showMessage('❌ Invalid or expired reset token');
            }
        });

        document.getElementById('toggleNew').addEventListener('click', () => {
            const type = newPassword.type === 'password' ? 'text' : 'password';
            newPassword.type = type;
            const icon = document.querySelector('#toggleNew i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });

        document.getElementById('toggleConfirm').addEventListener('click', () => {
            const type = confirmPassword.type === 'password' ? 'text' : 'password';
            confirmPassword.type = type;
            const icon = document.querySelector('#toggleConfirm i');
            icon.classList.toggle('fa-eye');
            icon.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
